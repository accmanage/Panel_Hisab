<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Panel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  display: flex;
  justify-content: center;
}

/* Card */
.sheet {
  width: 95%;
  max-width: 500px;
  margin-top: 12px;
  padding: 18px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 35px rgba(0,150,255,0.25);
  color: white;
}

/* Header */
h3 {
  text-align: center;
  font-size: 14px;
}

h3 input {
  border: none;
  background: transparent;
  color: #4fc3ff;
  font-weight: bold;
  text-align: center;
  width: 90px;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  border: 1px solid rgba(255,255,255,0.15);
  padding: 10px;
  font-size: 13px;
  text-align: center;
}

th {
  background: rgba(0,150,255,0.2);
  color: #4fc3ff;
}

.label {
  background: rgba(255,255,255,0.08);
  font-weight: bold;
}

.final {
  background: rgba(255,255,255,0.08);
  color: #4fc3ff;
  font-weight: bold;
  border-top: 2px solid rgba(79,195,255,0.4);
}

/* Normal inputs */
.auto-input {
  width: 100%;
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: center;
}

/* ✅ SMART INPUT (SITE & ID) */
.smart-input {
  width: 100%;
  max-width: 15ch;

  border: none;
  background: transparent;
  color: #4fc3ff;

  resize: none;
  overflow: hidden;

  white-space: normal;
  word-break: break-word;

  text-align: left;
  font-weight: 600;
  line-height: 1.2;
}

/* Share row */
.share-row {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.percent-input {
  width: 40px;
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: center;
}

/* Date */
input[type="date"] {
  background: rgba(255,255,255,0.1);
  border: none;
  padding: 4px 6px;
  border-radius: 6px;
  color: white;
}

/* Value colors */
.positive { background: rgba(0,255,100,0.25) !important; }
.negative { background: rgba(255,0,0,0.25) !important; }

/* Button */
.download-btn {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: linear-gradient(90deg, #4fc3ff, #6a82fb);
  color: white;
  font-weight: bold;
  border: none;
}
</style>
</head>

<body>

<div class="sheet" id="capture">

<h3>
  GROUP :
  <input id="group">
  |
  <input id="name">
</h3>

<table>

<tr>
<td colspan="4" style="text-align:right;">
  DATE :
  <input type="date" id="date">
</td>
</tr>

<tr>
<th>SR</th>
<th>SITE</th>
<th>ID</th>
<th>SETTLING</th>
</tr>

<tr>
<td>1</td>
<td><textarea id="site" class="smart-input"></textarea></td>
<td><textarea id="id" class="smart-input"></textarea></td>
<td><input id="settling" class="auto-input" value="0"></td>
</tr>

<tr><td colspan="4"></td></tr>

<tr>
<td colspan="3" class="label">HOLD BALANCE</td>
<td><input id="hold" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">TOTAL</td>
<td id="total"></td>
</tr>

<tr>
<td colspan="3" class="label">
  <div class="share-row">
    SHARE @ <input id="percent" class="percent-input" value="">%
  </div>
</td>
<td id="share"></td>
</tr>

<tr>
<td colspan="3" class="label">RCVD THIS WEEK</td>
<td><input id="rcvd" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">PREVIOUS BALANCE</td>
<td><input id="prev" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">OPENING PUNT BAL</td>
<td><input id="opening" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="final">FINAL</td>
<td class="final" id="final"></td>
</tr>

</table>

<button class="download-btn" onclick="downloadImage()">Download</button>

</div>

<script>
// Auto height for SITE & ID
function autoHeight(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

["site", "id"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("input", () => autoHeight(el));
});

// Calculation
function applyColor(el, value) {
  let target = el.tagName === "INPUT" ? el.parentElement : el;
  target.classList.remove("positive", "negative");

  if (value > 0) target.classList.add("positive");
  else if (value < 0) target.classList.add("negative");
}

function calc() {
  let settlingVal = +document.getElementById("settling").value || 0;
  let holdVal = +document.getElementById("hold").value || 0;
  let percentVal = +document.getElementById("percent").value || 0;
  let rcvdVal = +document.getElementById("rcvd").value || 0;
  let prevVal = +document.getElementById("prev").value || 0;
  let openingVal = +document.getElementById("opening").value || 0;

  let totalVal = settlingVal + holdVal;
  let shareVal = settlingVal * (percentVal / 100);
  let finalVal = prevVal + openingVal - rcvdVal + shareVal;

  document.getElementById("total").innerText = totalVal.toFixed(2);
  document.getElementById("share").innerText = shareVal.toFixed(2);
  document.getElementById("final").innerText = finalVal.toFixed(2);

  applyColor(document.getElementById("settling"), settlingVal);
  applyColor(document.getElementById("hold"), holdVal);
  applyColor(document.getElementById("total"), totalVal);
  applyColor(document.getElementById("final"), finalVal);
}

// Bind inputs
document.querySelectorAll("input").forEach(i => {
  i.addEventListener("input", calc);
});

calc();

// Download
function downloadImage() {
  html2canvas(document.getElementById("capture"), {
    scale: 3,
    backgroundColor: null
  }).then(canvas => {
    let link = document.createElement("a");
    link.download = "sheet.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>

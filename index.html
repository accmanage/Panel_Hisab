<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuristic Panel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  display: flex;
  justify-content: center;
}

/* Card */
.sheet {
  width: 95%;
  max-width: 500px;
  margin-top: 12px;
  padding: 18px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 35px rgba(0,150,255,0.25);
  color: white;
}

/* Header */
h3 {
  text-align: center;
  font-size: 14px;
}

h3 input {
  border: none;
  background: transparent;
  color: #4fc3ff;
  font-weight: bold;
  text-align: center;
  width: 90px;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
}

td, th {
  border: 1px solid rgba(255,255,255,0.15);
  padding: 10px;
  font-size: 13px;
  text-align: center;
  overflow: visible;
}

th {
  background: rgba(0,150,255,0.2);
  color: #4fc3ff;
}

.label {
  background: rgba(255,255,255,0.08);
  font-weight: bold;
}

.final {
  background: rgba(255,255,255,0.08);
  color: #4fc3ff;
  font-weight: bold;
  border-top: 2px solid rgba(79,195,255,0.4);
}

/* Normal Inputs */
.auto-input {
  width: 100%;
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: center;
  font-weight: 600;
}

/* ✅ WRAP ONLY SITE & ID */
.wrap-input {
  width: 100%;
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: left;
  font-weight: 600;
  white-space: normal;
  word-break: break-word;
}

/* Share row */
.share-row {
  display: flex;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}

.percent-input {
  width: 40px;
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: center;
}

/* Date */
input[type="date"] {
  background: rgba(255,255,255,0.1);
  border: none;
  padding: 4px 6px;
  border-radius: 6px;
  color: white;
}

/* Value colors */
.positive { background: rgba(0,255,100,0.25) !important; }
.negative { background: rgba(255,0,0,0.25) !important; }

/* Button */
.download-btn {
  width: 100%;
  padding: 12px;
  margin-top: 14px;
  border-radius: 10px;
  background: linear-gradient(90deg, #4fc3ff, #6a82fb);
  color: white;
  font-weight: bold;
  border: none;
}
</style>
</head>

<body>

<div class="sheet" id="capture">

<h3>
  GROUP :
  <input id="group">
  |
  <input id="name">
</h3>

<table>

<tr>
<td colspan="4" style="text-align:right;">
  DATE :
  <input type="date" id="date">
</td>
</tr>

<tr>
<th>SR</th>
<th>SITE</th>
<th>ID</th>
<th>SETTLING</th>
</tr>

<tr>
<td>1</td>
<td><input id="site" class="wrap-input"></td>
<td><input id="id" class="wrap-input"></td>
<td><input id="settling" class="auto-input" value="0"></td>
</tr>

<tr><td colspan="4"></td></tr>

<tr>
<td colspan="3" class="label">HOLD BALANCE</td>
<td><input id="hold" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">TOTAL</td>
<td id="total"></td>
</tr>

<tr>
<td colspan="3" class="label">
  <div class="share-row">
    SHARE @ 
    <input id="percent" class="percent-input" value="70">%
  </div>
</td>
<td id="share"></td>
</tr>

<tr>
<td colspan="3" class="label">RCVD THIS WEEK</td>
<td><input id="rcvd" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">PREVIOUS BALANCE</td>
<td><input id="prev" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">OPENING PUNT BAL</td>
<td><input id="opening" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="final">FINAL</td>
<td class="final" id="final"></td>
</tr>

</table>

<button class="download-btn" onclick="downloadImage()">Download</button>

</div>

<script>
function applyColor(el, value) {
  let target = el.tagName === "INPUT" ? el.parentElement : el;
  target.classList.remove("positive", "negative");

  if (value > 0) target.classList.add("positive");
  else if (value < 0) target.classList.add("negative");
}

function calc() {
  let settlingEl = document.getElementById("settling");
  let holdEl = document.getElementById("hold");
  let totalEl = document.getElementById("total");
  let finalEl = document.getElementById("final");

  let settling = +settlingEl.value || 0;
  let hold = +holdEl.value || 0;
  let percent = +document.getElementById("percent").value || 0;
  let rcvd = +document.getElementById("rcvd").value || 0;
  let prev = +document.getElementById("prev").value || 0;
  let opening = +document.getElementById("opening").value || 0;

  let total = settling + hold;
  let share = settling * (percent / 100);
  let final = prev + opening - rcvd + share;

  totalEl.innerText = total.toFixed(2);
  document.getElementById("share").innerText = share.toFixed(2);
  finalEl.innerText = final.toFixed(2);

  applyColor(settlingEl, settling);
  applyColor(holdEl, hold);
  applyColor(totalEl, total);
  applyColor(finalEl, final);
}

document.querySelectorAll("input").forEach(i => {
  i.addEventListener("input", calc);
});

calc();

function downloadImage() {
  html2canvas(document.getElementById("capture"), {
    scale: 3,
    backgroundColor: null
  }).then(canvas => {
    let link = document.createElement("a");
    link.download = "sheet.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>

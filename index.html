<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Panel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  display: flex;
  justify-content: center;
}

/* Card */
.sheet {
  width: 95%;
  max-width: 500px;
  margin-top: 12px;
  padding: 18px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 35px rgba(0,150,255,0.25);
  color: white;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  border: 1px solid rgba(255,255,255,0.15);
  padding: 10px;
  font-size: 13px;
  text-align: center;
}

th {
  background: rgba(0,150,255,0.2);
  color: #4fc3ff;
}

.label {
  background: rgba(255,255,255,0.08);
  font-weight: bold;
}

.final {
  background: rgba(255,255,255,0.08);
  color: #4fc3ff;
  font-weight: bold;
}

/* Inputs */
.auto-input {
  width: 100%;
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: center;
}

/* TEXTAREA (input mode) */
.smart-input {
  width: 100%;
  max-width: 13ch;
  border: none;
  background: transparent;
  color: #4fc3ff;
  resize: none;
  overflow: hidden;
  text-align: left;
}

/* DISPLAY TEXT (capture mode) */
.display-text {
  display: none;
  white-space: pre-wrap;
  word-break: break-word;
  color: #4fc3ff;
  text-align: left;
  font-weight: 600;
}

/* Switch modes */
.capture-mode textarea {
  display: none;
}
.capture-mode .display-text {
  display: block;
}

/* Button */
.download-btn {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: linear-gradient(90deg, #4fc3ff, #6a82fb);
  color: white;
  font-weight: bold;
  border: none;
}
</style>
</head>

<body>

<div class="sheet" id="capture">

<table>

<tr>
<td colspan="4" style="text-align:right;">
  DATE :
  <input type="date" id="date">
</td>
</tr>

<tr>
<th>SR</th>
<th>SITE</th>
<th>ID</th>
<th>SETTLING</th>
</tr>

<tr>
<td>1</td>

<td>
  <textarea id="siteInput" class="smart-input"></textarea>
  <div id="siteDisplay" class="display-text"></div>
</td>

<td>
  <textarea id="idInput" class="smart-input"></textarea>
  <div id="idDisplay" class="display-text"></div>
</td>

<td><input id="settling" class="auto-input" value="0"></td>
</tr>

<tr><td colspan="4"></td></tr>

<tr>
<td colspan="3" class="label">HOLD BALANCE</td>
<td><input id="hold" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">TOTAL</td>
<td id="total"></td>
</tr>

<tr>
<td colspan="3" class="label">SHARE @ 70%</td>
<td id="share"></td>
</tr>

<tr>
<td colspan="3" class="label">RCVD THIS WEEK</td>
<td><input id="rcvd" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">PREVIOUS BALANCE</td>
<td><input id="prev" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">OPENING PUNT BAL</td>
<td><input id="opening" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="final">FINAL</td>
<td class="final" id="final"></td>
</tr>

</table>

<button class="download-btn" onclick="downloadImage()">Download</button>

</div>

<script>
// Sync textarea → display div
function sync(inputId, displayId) {
  const input = document.getElementById(inputId);
  const display = document.getElementById(displayId);

  input.addEventListener("input", () => {
    display.innerText = input.value;

    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });
}

sync("siteInput", "siteDisplay");
sync("idInput", "idDisplay");

// Calculation
function calc() {
  let settling = +document.getElementById("settling").value || 0;
  let hold = +document.getElementById("hold").value || 0;
  let rcvd = +document.getElementById("rcvd").value || 0;
  let prev = +document.getElementById("prev").value || 0;
  let opening = +document.getElementById("opening").value || 0;

  let total = settling + hold;
  let share = settling * 0.7;
  let final = prev + opening - rcvd + share;

  document.getElementById("total").innerText = total.toFixed(2);
  document.getElementById("share").innerText = share.toFixed(2);
  document.getElementById("final").innerText = final.toFixed(2);
}

document.querySelectorAll("input").forEach(i => {
  i.addEventListener("input", calc);
});

calc();

// Download as JPEG (NO CUT)
function downloadImage() {
  const element = document.getElementById("capture");

  element.classList.add("capture-mode");

  html2canvas(element, {
    scale: 3,
    backgroundColor: "#ffffff"
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "sheet.jpg";
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.click();

    element.classList.remove("capture-mode");
  });
}
</script>

</body>
</html>

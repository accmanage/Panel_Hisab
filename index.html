<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Panel</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;

  /* 🧊 IMAGE BACKGROUND */
  background: url('https://images.openai.com/static-rsc-4/GDccpKjdvIZ9H9pmRf7bmjZILQXNMLDirjLOg88UGHL1sUHcFUZ64zz8NhgrwvCVYL4oyPgQK-9-gUB8Ekh92Rbs2l2-eC-E8BGqWxo-_fEkFCokXoAmt51Z9vv5UfUmicP_C36U4rPsJuMiKinB_telvT4THKncYHybMdyEiAqheCw9nEKhYeija3_xWZla?purpose=fullsize') no-repeat center center fixed;
  background-size: cover;

  display: flex;
  justify-content: center;
}

/* dark overlay for readability */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

/* CONTAINER */
.container {
  width: 95%;
  max-width: 420px;
  margin: 10px;
}

/* GLASS CARD */
.card {
  border-radius: 16px;
  padding: 10px;
  margin-bottom: 8px;

  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,0.08);

  box-shadow: 0 6px 20px rgba(0,0,0,0.6);

  color: #e5e7eb;
}

/* HEADER */
.header {
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  color: #22d3ee;
}

/* ROW */
.row {
  display: flex;
  align-items: center;
  margin: 6px 0;
}

/* LABEL */
.label {
  width: 50%;
  font-size: 15px;
  color: #fcfdff;
  padding-left: 10px;
}
.label1 {
  width: 50%;
  font-size: 18px;
  color: #fcfdff;
  padding-left: 30px;
}

/* INPUT */
.input {
  width: 50%;
  border: none;
  outline: none;

  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  padding: 6px;

  color: #22d3ee;
  text-align: center;

  border: 1px solid rgba(255,255,255,0.05);
  font-size: 13px;

  text-transform: uppercase;
}

/* TEXTAREA */
.textarea {
  width: 50%;
  he
  border: none;
  outline: none;

  background: rgba(255,255,255,0.02);
  border-radius: 8px;
  padding: 6px;
  text-align: center;
  color: #22d3ee;

  border: 1px solid rgba(255,255,255,0.05);

  resize: none;
  font-size: 13px;

  text-transform: uppercase;
}

/* VALUE */
.value {
  width: 50%;
  padding: 6px;
  border-radius: 8px;
  text-align: center;

  background: rgba(255,255,255,0.03);

  border: 1px solid rgba(255,255,255,0.05);

  color: #22d3ee;
  font-size: 13px;
}

/* POSITIVE */
.positive {
  background: rgba(0,255,120,0.12);
  border: 1px solid rgba(0,255,120,0.5);
  box-shadow: 0 0 8px rgba(0,255,120,0.5);
  color: #00ff9c;
}

/* NEGATIVE */
.negative {
  background: rgba(255,0,0,0.12);
  border: 1px solid rgba(255,0,0,0.5);
  box-shadow: 0 0 8px rgba(255,0,0,0.5);
  color: #ff4d4d;
}

/* FINAL */
.final {
  font-size: 15px;
  font-weight: bold;
  color: #38bdf8;
}
#date {
  width: 80% !important;
}
#site {
  width: 80% !important;
}
#id {
  width: 80% !important;
}

</style>
</head>

<body>

<div class="container">

<div class="card header">
  GROUP  
  <input id="group" class="input">
</div>

<div class="card">
  <div class="row">
    <div class="label1">DATE</div>
    <input type="date" id="date" class="input" style="text-transform:none;">
  </div>
</div>

<div class="card">
  <div class="row">
    <div class="label1">SITE</div>
    <textarea id="site" class="textarea"></textarea>
  </div>

  <div class="row">
    <div class="label1">ID</div>
    <textarea id="id" class="textarea"></textarea>
  </div>
</div>

<div class="card">
  <div class="row">
    <div class="label">SETTLING</div>
    <input id="settling" class="input" value="0">
  </div>

  <div class="row">
    <div class="label">HOLD BALANCE</div>
    <input id="hold" class="input" value="0">
  </div>

  <div class="row">
    <div class="label">TOTAL BALANCE</div>
    <div id="total" class="value"></div>
  </div>

  <div class="row">
    <div class="label">
      SHARE @ <input id="percent" class="input" style="width:60px;" value="0">%
    </div>
    <div id="share" class="value"></div>
  </div>

  <div class="row">
    <div class="label">RECEIVED THIS WEEK</div>
    <input id="rcvd" class="input" value="0">
  </div>

  <div class="row">
    <div class="label">PREVIOUS BALANCE</div>
    <input id="prev" class="input" value="0">
  </div>

  <div class="row">
    <div class="label">OPENING PUNTER BALANCE</div>
    <input id="opening" class="input" value="0">
  </div>

</div>

<div class="card">
  <div class="row final">
    <div class="label">FINAL</div>
    <div id="final" class="value final"></div>
  </div>
</div>

</div>

<script>
// AUTO CAPITALIZE
["group", "site", "id"].forEach(id => {
  let el = document.getElementById(id);
  el.addEventListener("input", () => {
    el.value = el.value.toUpperCase();
  });
});

function applyColor(el, value) {
  el.classList.remove("positive", "negative");
  if (value > 0) el.classList.add("positive");
  else if (value < 0) el.classList.add("negative");
}

function calc() {
  let settling = +settlingEl.value || 0;
  let hold = +holdEl.value || 0;
  let percent = +percentEl.value || 0;
  let rcvd = +rcvdEl.value || 0;
  let prev = +prevEl.value || 0;
  let opening = +openingEl.value || 0;

  let total = settling + hold;
  let share = settling * (percent / 100);
  let final = prev + opening - rcvd + share;

  totalEl.innerText = total.toFixed(2);
  shareEl.innerText = share.toFixed(2);
  finalEl.innerText = final.toFixed(2);

  applyColor(settlingEl, settling);
  applyColor(holdEl, hold);
  applyColor(totalEl, total);
  applyColor(finalEl, final);

  shareEl.classList.remove("positive", "negative");
}

let settlingEl = document.getElementById("settling");
let holdEl = document.getElementById("hold");
let percentEl = document.getElementById("percent");
let rcvdEl = document.getElementById("rcvd");
let prevEl = document.getElementById("prev");
let openingEl = document.getElementById("opening");

let totalEl = document.getElementById("total");
let shareEl = document.getElementById("share");
let finalEl = document.getElementById("final");

document.querySelectorAll("input, textarea").forEach(i => {
  i.addEventListener("input", calc);
});

calc();
</script>

</body>
</html>

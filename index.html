<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Mobile Fit</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial;
  margin: 0;
  background: #f0f0f0;
  padding-bottom: 70px;
}

/* Main container */
.sheet {
  width: 100%;
  height: 100vh;
  background: white;
  padding: 8px;
  display: flex;
  flex-direction: column;
}

/* Header */
h3 {
  text-align: center;
  font-size: 14px;
  margin: 5px 0;
}

h3 input {
  border: none;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  background: transparent;
  width: 90px;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

td, th {
  border: 1px solid #333;
  padding: 6px;
  font-size: 12px;
  text-align: center;
}

th {
  background: #2f5d50;
  color: white;
}

.label {
  background: #d8caa6;
  font-weight: bold;
  white-space: nowrap;
}

.final {
  background: yellow;
  font-weight: bold;
}

/* Inputs */
.auto-input {
  width: 100%;
  border: none;
  background: transparent;
  text-align: center;
  font-size: 12px;
}

/* SHARE row fix */
.share-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.percent-input {
  width: 35px;
  border: none;
  background: transparent;
  text-align: center;
  font-weight: bold;
}

/* Colors */
.positive {
  background: #b7e1b0 !important;
}

.negative {
  background: #f4b4b4 !important;
}

/* Button */
.download-btn {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 12px;
  font-size: 14px;
  background: #2f5d50;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="sheet" id="capture">

<h3>
  GROUP :
  <input id="group">
  |
  <input id="name">
</h3>

<table>

<tr>
<th>SR</th>
<th>SITE</th>
<th>ID</th>
<th>SETTLING</th>
</tr>

<tr>
<td>1</td>
<td><input id="site" class="auto-input"></td>
<td><input id="id" class="auto-input"></td>
<td><input id="settling" class="auto-input" value="0"></td>
</tr>

<tr><td colspan="4"></td></tr>

<tr>
<td colspan="3" class="label">HOLD BALANCE</td>
<td><input id="hold" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">TOTAL</td>
<td id="total"></td>
</tr>

<tr>
<td colspan="3" class="label">
  <div class="share-row">
    OUR SHARE @
    <input id="percent" class="percent-input" value="0">%
  </div>
</td>
<td id="share"></td>
</tr>

<tr>
<td colspan="3" class="label">RCVD THIS WEEK</td>
<td><input id="rcvd" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">PREVIOUS BALANCE</td>
<td><input id="prev" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">OPENING PUNT BAL</td>
<td><input id="opening" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="final">FINAL</td>
<td class="final" id="final"></td>
</tr>

</table>
</div>

<button class="download-btn" onclick="downloadImage()">Download</button>

<script>
// Color Logic
function applyColor(el, value) {
  let target = el.tagName === "INPUT" ? el.parentElement : el;

  target.classList.remove("positive", "negative");

  if (value > 0) target.classList.add("positive");
  else if (value < 0) target.classList.add("negative");
}

// Calculation
function calc() {
  let settlingEl = document.getElementById("settling");
  let holdEl = document.getElementById("hold");
  let totalEl = document.getElementById("total");
  let finalEl = document.getElementById("final");

  let settling = +settlingEl.value || 0;
  let hold = +holdEl.value || 0;
  let percent = +document.getElementById("percent").value || 0;
  let rcvd = +document.getElementById("rcvd").value || 0;
  let prev = +document.getElementById("prev").value || 0;
  let opening = +document.getElementById("opening").value || 0;

  let total = settling + hold;
  let share = settling * (percent / 100);
  let final = prev + opening - rcvd + share;

  totalEl.innerText = total.toFixed(2);
  document.getElementById("share").innerText = share.toFixed(2);
  finalEl.innerText = final.toFixed(2);

  applyColor(settlingEl, settling);
  applyColor(holdEl, hold);
  applyColor(totalEl, total);
  applyColor(finalEl, final);
}

// Events
document.querySelectorAll("input").forEach(i => {
  i.addEventListener("input", calc);
});

calc();

// Download
function downloadImage() {
  html2canvas(document.getElementById("capture"), { scale: 2 }).then(canvas => {
    let link = document.createElement("a");
    link.download = "sheet.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Panel</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;

  background: url('https://images.openai.com/static-rsc-4/GDccpKjdvIZ9H9pmRf7bmjZILQXNMLDirjLOg88UGHL1sUHcFUZ64zz8NhgrwvCVYL4oyPgQK-9-gUB8Ekh92Rbs2l2-eC-E8BGqWxo-_fEkFCokXoAmt51Z9vv5UfUmicP_C36U4rPsJuMiKinB_telvT4THKncYHybMdyEiAqheCw9nEKhYeija3_xWZla?purpose=fullsize') no-repeat center center fixed;
  background-size: cover;

  display: flex;
  justify-content: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

.container {
  width: 95%;
  max-width: 420px;
  margin: 10px;
}

.card {
  border-radius: 16px;
  padding: 10px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  color: #e5e7eb;
}

.row {
  display: flex;
  align-items: center;
  margin: 6px 0;
}

.label {
  width: 50%;
  font-size: 13px;
  color: #fcfdff;
  padding-left: 5px;
}

.label1 {
  font-size: 14px;
  color: #e5e7eb;
  text-align: center;
  margin-bottom: 4px;
}

.label11 {
  width: 50%;
  font-size: 18px;
  color: #fcfdff;
  padding-left: 5px;
}

.input {
  width: 50%;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  padding: 6px;
  color: #22d3ee;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.05);
  font-size: 13px;
  text-transform: uppercase;
}

.textarea {
  width: 50%;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.02);
  border-radius: 8px;
  padding: 6px;
  text-align: center;
  color: #22d3ee;
  border: 1px solid rgba(255,255,255,0.05);
  resize: none;
  font-size: 13px;
  text-transform: uppercase;
}

.value {
  width: 50%;
  padding: 6px;
  border-radius: 8px;
  text-align: center;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  color: #22d3ee;
  font-size: 13px;
  height: 30px;
}

.positive {
  background: rgba(0,255,120,0.12);
  border: 1px solid rgba(0,255,120,0.5);
  box-shadow: 0 0 8px rgba(0,255,120,0.5);
  color: #00ff9c;
}

/* NEGATIVE */
.negative {
  background: rgba(255,0,0,0.12);
  border: 1px solid rgba(255,0,0,0.5);
  box-shadow: 0 0 8px rgba(255,0,0,0.5);
  color: #ff4d4d;
}

.final {
  font-size: 15px;
  font-weight: bold;
  color: #38bdf8;
}

.header-row {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.header-left,
.header-right {
  width: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.header-left .input,
.header-right .input {
  width: 85%;
}

.date-input {
  text-transform: none;
}

select.input {
  width: 50%;
  height: 40px;
  appearance: none;
}


</style>
</head>

<body>

<div class="container">

<div class="card header-row">
  <div class="header-left">
    <span class="label1">GROUP</span>
    <input id="group" class="input">
  </div>

  <div class="header-right">
    <span class="label1">DATE</span>
    <input type="date" id="date" class="input date-input">
  </div>
</div>

<div class="card">
  <div class="row">
    <div class="label11">TYPE</div>
    <select id="type" class="input">
      <option value="Franchise">Franchise</option>
      <option value="OWN">OWN</option>
    </select>
  </div>

  <div class="row">
    <div class="label11">SITE</div>
    <textarea id="site" class="textarea"></textarea>
  </div>

  <div class="row">
    <div class="label11">BRANCH NAME</div>
    <textarea id="id" class="textarea"></textarea>
  </div>
</div>

<div class="card">
  <div class="row" id="row-settling">
    <div class="label">SETTLING</div>
    <input id="settling" class="input" value="0">
  </div>
<div class="row" id="row-share1">
    <div class="label">
      C \Share@ <input id="percent1" class="input" style="width:60px;" value="0">%
    </div>
    <div id="share1" class="value"></div>
  </div>

  <div class="row" id="row-share">
    <div class="label">
      SHARE @ <input id="percent" class="input" style="width:60px;" value="0">%
    </div>
    <div id="share" class="value"></div>
  </div>

  <div class="row" id="row-total">
    <div class="label">TOTAL BALANCE</div>
    <div id="total" class="value"></div>
  </div>
 
  <div class="row" id="row-hold">
    <div class="label">HOLD BALANCE</div>
    <input id="hold" class="input" value="0">
  </div>


  <div class="row" id="row-rcvd">
    <div class="label">RECEIVED THIS WEEK</div>
    <input id="rcvd" class="input" value="0">
  </div>

  <div class="row" id="row-prev">
    <div class="label">PREVIOUS BALANCE</div>
    <input id="prev" class="input" value="0">
  </div>

  

  <!-- OWN rows -->
  
  <div class="row" id="row-freeze">
    <div class="label">FREEZE</div>
    <input id="freeze" class="input" value="0">
  </div>

  <div class="row" id="row-expenses">
    <div class="label">EXPENSES</div>
    <input id="expenses" class="input" value="0">
  </div>
  <div class="row" id="row-opening">
    <div class="label">OPENING PUNTER BALANCE</div>
    <input id="opening" class="input" value="0">
  </div>

</div>

<div class="card">
  <div class="row final">
    <div class="label">FINAL</div>
    <div id="final" class="value final"></div>
  </div>
</div>

</div>

<script>
["group", "site", "id"].forEach(id => {
  document.getElementById(id).addEventListener("input", e => {
    e.target.value = e.target.value.toUpperCase();
  });
});

const typeEl = document.getElementById("type");

function show(id){ document.getElementById(id).style.display = "flex"; }
function hide(id){ document.getElementById(id).style.display = "none"; }

function updateTypeUI(){
  let type = typeEl.value;

  if(type === "Franchise"){
    // show correct rows
    show("row-share");
    hide("row-share1");

    show("row-hold");
    show("row-total");
    show("row-rcvd");
    show("row-prev");
    show("row-opening");

    hide("row-freeze");
    hide("row-expenses");

    // 🔥 reset OWN share display
    document.getElementById("share1").innerText = "";

  } else {
    // OWN mode
    hide("row-share");
    show("row-share1");

    hide("row-total");
    hide("row-rcvd");
    hide("row-prev");
    show("row-opening");

    show("row-freeze");
    show("row-expenses");

    // 🔥 reset Franchise share display
    document.getElementById("share").innerText = "";
  }

  calc(); // 🔥 force recalculation after switch
}

typeEl.addEventListener("change", updateTypeUI);

function applyColor(el,v){
  el.classList.remove("positive","negative");
  if(v>0) el.classList.add("positive");
  else if(v<0) el.classList.add("negative");
}

function calc(){
  let type = typeEl.value;

  // ✅ CORRECT way (always use getElementById)
  let settlingVal = +document.getElementById("settling").value || 0;
  let holdVal = +document.getElementById("hold").value || 0;
  let percentVal = +document.getElementById("percent").value || 0;
  let rcvdVal = +document.getElementById("rcvd").value || 0;
  let prevVal = +document.getElementById("prev").value || 0;
  let openingVal = +document.getElementById("opening").value || 0;
  let freezeVal = +document.getElementById("freeze").value || 0;
  let expensesVal = +document.getElementById("expenses").value || 0;
  let percentVal1 = +document.getElementById("percent1").value || 0;

  
  let share = settlingVal * (percentVal / 100);
  let share1 = settlingVal * (percentVal1 / 100);
  let total = settlingVal - share;
  let final;
  if(type === "Franchise"){
    final = total + holdVal - rcvdVal + prevVal + openingVal;
  } else {
    final = settlingVal - share1 + holdVal - freezeVal - expensesVal + openingVal;
  }

  // update UI
  totalEl.innerText = total.toFixed(2);
  if(type === "Franchise"){
    shareEl.innerText = share.toFixed(2);
  } else {
    document.getElementById("share1").innerText = share1.toFixed(2);
  }
  finalEl.innerText = final.toFixed(2);

  // colors
  applyColor(document.getElementById("settling"), settlingVal);
  applyColor(document.getElementById("hold"), holdVal);
  applyColor(totalEl, total);
  applyColor(finalEl, final);

  shareEl.classList.remove("positive","negative");
}
let totalEl=document.getElementById("total");
let shareEl=document.getElementById("share");
let finalEl=document.getElementById("final");

document.querySelectorAll("input,textarea,select").forEach(i=>{
  i.addEventListener("input",calc);
});

updateTypeUI();
calc();
</script>

</body>
</html>

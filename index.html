<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Panel</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  display: flex;
  justify-content: center;
}

.sheet {
  width: 95%;
  max-width: 500px;
  margin-top: 12px;
  padding: 12px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 35px rgba(0,150,255,0.25);
  color: white;
}

/* 🔥 HEADER FIX ONLY */
h3 {
  text-align: center;
  font-size: 14px;
  margin-bottom: 10px;
}

.header-input {
  width: 90px; /* fixed width */
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: center;
  font-weight: bold;
  outline: none;
}
#date {
  border: none;
  background: rgba(255,255,255,0.08);
  color: #4fc3ff;
  padding: 4px 6px;
  border-radius: 6px;
  font-size: 12px;
  outline: none;
}

/* cells */
td, th {
  border: 1px solid rgba(255,255,255,0.15);
  padding: 6px;
  font-size: 12px;
  text-align: center;
}

th {
  background: rgba(0,150,255,0.2);
  color: #4fc3ff;
}

.label {
  background: rgba(255,255,255,0.08);
  font-weight: bold;
}

.final {
  background: rgba(255,255,255,0.08);
  color: #4fc3ff;
  font-weight: bold;
}

/* inputs */
.auto-input {
  width: 100%;
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: center;
}

.percent-box {
  width: 45px;
  border: none;
  background: transparent;
  color: #4fc3ff;
  text-align: center;
}

/* TEXTAREA */
.smart-input {
  width: 100%;
  border: none;
  background: transparent;
  color: #4fc3ff;

  resize: none;
  overflow: hidden;

  text-align: left;

  white-space: pre-wrap;      /* ✅ allow wrapping */
  word-break: break-word;     /* ✅ break long text */
  overflow-wrap: break-word;  /* ✅ clean wrap */

  font-size: 12px;
}

/* colors */
.positive {
  background: rgba(0,255,100,0.25) !important;
}

.negative {
  background: rgba(255,0,0,0.25) !important;
}
</style>
</head>

<body>

<div class="sheet">

<h3>
  GROUP :
  <input id="group" class="header-input" value="">
  |
  <input id="name" class="header-input" value="">
</h3>

<table>
<colgroup>
  <col style="width:5%">   <!-- SR -->
  <col style="width:32%">  <!-- SITE -->
  <col style="width:32%">  <!-- ID -->
  <col style="width:31%">  <!-- SETTLING -->
</colgroup>
<tr>
<td colspan="4" style="text-align:right;">
  DATE :
  <input type="date" id="date">
</td>
</tr>

<tr>
<th>SR</th>
<th>SITE</th>
<th>ID</th>
<th>SETTLING</th>
</tr>

<tr>
<td>1</td>
<td><textarea id="site" class="smart-input"></textarea></td>
<td><textarea id="id" class="smart-input"></textarea></td>
<td><input id="settling" class="auto-input" value="0"></td>
</tr>

<tr><td colspan="4"></td></tr>

<tr>
<td colspan="3" class="label">HOLD BALANCE</td>
<td><input id="hold" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">TOTAL</td>
<td id="total"></td>
</tr>

<tr>
<td colspan="3" class="label">
  OUR SHARE @ 
  <input id="percent" class="percent-box" value="0">%
</td>
<td id="share"></td>
</tr>

<tr>
<td colspan="3" class="label">RECEIVED THIS WEEK</td>
<td><input id="rcvd" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">PREVIOUS BALANCE</td>
<td><input id="prev" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="label">OPENING PUNTER BALANCE</td>
<td><input id="opening" class="auto-input" value="0"></td>
</tr>

<tr>
<td colspan="3" class="final">FINAL</td>
<td class="final" id="final"></td>
</tr>

</table>

</div>

<script>
// Color helper
function applyColor(el, value) {
  let target = el.tagName === "INPUT" ? el.parentElement : el;

  target.classList.remove("positive", "negative");

  if (value > 0) target.classList.add("positive");
  else if (value < 0) target.classList.add("negative");
}

// Calculation
function calc() {
  let settlingEl = document.getElementById("settling");
  let holdEl = document.getElementById("hold");
  let totalEl = document.getElementById("total");
  let finalEl = document.getElementById("final");
  let shareEl = document.getElementById("share");

  let settling = +settlingEl.value || 0;
  let hold = +holdEl.value || 0;
  let percent = +document.getElementById("percent").value || 0;
  let rcvd = +document.getElementById("rcvd").value || 0;
  let prev = +document.getElementById("prev").value || 0;
  let opening = +document.getElementById("opening").value || 0;

  let total = settling + hold;
  let share = settling * (percent / 100);
  let final = prev + opening - rcvd + share;

  totalEl.innerText = total.toFixed(2);
  shareEl.innerText = share.toFixed(2);
  finalEl.innerText = final.toFixed(2);

  applyColor(settlingEl, settling);
  applyColor(holdEl, hold);
  applyColor(totalEl, total);
  applyColor(finalEl, final);
}

// Bind inputs
document.querySelectorAll("input").forEach(i => {
  i.addEventListener("input", calc);
});

calc();
</script>

</body>
</html>
